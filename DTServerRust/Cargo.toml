[package]
name = "dt-server"
version = "2611.1.0"
edition = "2021"
description = "Rust port of the Digital Twin Server: embedded MQTT v5 broker and server logic"
publish = false

[lib]
name = "dt_server"
path = "src/lib.rs"

[[bin]]
name = "dt-server"
path = "src/main.rs"

[features]
# Real twin backend: cxx bridge to the C++ facade in ffi/ (needs the existing C++ build tree, see README).
ffi = ["dep:cxx", "dep:cxx-build", "dep:serde_json"]
# Unit test that checks the syntax of all SQL with PostgreSQL's own parser (libpg_query, no server needed). Off by
# default because its build needs libclang.
sql-syntax-check = ["dep:pg_query"]

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
cxx = { version = "1", optional = true }
pg_query = { version = "6", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate", "macros"] }

[build-dependencies]
cxx-build = { version = "1", optional = true }
# build.rs parses the Conan graph JSON (ffi/link_plan.rs); only needed with the feature.
serde_json = { version = "1", optional = true }

[dev-dependencies]
rumqttc = { version = "0.25", default-features = false }
tokio = { version = "1", features = ["full", "test-util"] }
