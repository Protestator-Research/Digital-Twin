[package]
name = "dt-server"
version = "2611.1.0"
edition = "2021"
description = "Rust port of the Digital Twin Server: embedded MQTT broker (3.1.1 and 5) and server logic"
publish = false

[lib]
name = "dt_server"
path = "src/lib.rs"

[[bin]]
name = "dt-server"
path = "src/main.rs"

[features]
# Real twin backend: cxx bridge to the C++ facade in ffi/ (needs the existing C++ build tree, see README).
ffi = ["dep:cxx", "dep:cxx-build", "dep:serde_json"]
# Unit test that checks the syntax of the schema and of the SQL of the REST API with PostgreSQL's own parser
# (libpg_query, no server needed). Off by default because its build needs libclang.
sql-syntax-check = ["dep:pg_query"]

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_urlencoded = "0.7"
sha2 = "0.10"
socket2 = "0.6"
thiserror = "2"
# TLS of the MQTT broker. The crypto provider is `ring` (the one reqwest and sqlx already build), so default
# features (aws-lc-rs, a native build dependency) are off.
# Floor 0.23.14: `with_single_cert` checks that the key belongs to the certificate (added in 0.23.11), and the PEM
# reader of `rustls::pki_types::pem` needs rustls-pki-types 1.9 or newer.
rustls = { version = "0.23.14", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
cxx = { version = "1", optional = true }
pg_query = { version = "6", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json"] }

[build-dependencies]
cxx-build = { version = "1", optional = true }
# build.rs parses the Conan graph JSON (ffi/link_plan.rs); only needed with the feature.
serde_json = { version = "1", optional = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
rumqttc = { version = "0.25", default-features = false }
# Test certificates for the TLS tests of the broker (ring, not aws-lc-rs).
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
tokio = { version = "1", features = ["full", "test-util"] }
